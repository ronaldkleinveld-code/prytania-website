<style>
  :root{--navy:#011627;--teal:#2ec4b6;--teal-d:#0f9b8e;--mist:#3b5265;--line:#dde8e8}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:Inter,system-ui,-apple-system,sans-serif;color:#1d2b36;min-height:100vh;display:grid;place-items:center;padding:24px;
       background:radial-gradient(700px 520px at 88% -8%,rgba(46,196,182,.35),transparent 60%),radial-gradient(640px 520px at 6% 108%,rgba(255,159,28,.25),transparent 60%),#f5f9f9}
  .card{background:rgba(255,255,255,.9);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:28px;padding:36px 32px 28px;max-width:430px;width:100%;box-shadow:0 24px 60px rgba(11,31,46,.10)}
  .logo{display:flex;align-items:center;gap:12px}
  .logo svg{height:30px;width:auto}
  h1,.kicker,button,.logo span{font-family:"Space Grotesk",system-ui,sans-serif}
  .logo span{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--mist);border-left:1px solid var(--line);padding-left:12px}
  .kicker{margin-top:26px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal-d);font-weight:600}
  h1{font-size:30px;letter-spacing:-.02em;line-height:1.2;color:var(--navy);margin:6px 0 10px;font-weight:650;letter-spacing:-.01em}
  p{color:var(--mist);font-size:14.5px;line-height:1.55}
  label{display:block;margin-top:22px;font-size:12.5px;font-weight:600;color:var(--navy);letter-spacing:.04em}
  input{width:100%;margin-top:8px;padding:14px 20px;font-size:16px;border:1px solid #c9d5dc;border-radius:999px;outline:none;font-family:inherit;letter-spacing:.04em}
  input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(28,165,152,.18)}
  button{margin-top:14px;width:100%;padding:14px;font-size:15px;font-weight:600;border:0;border-radius:999px;background:var(--navy);color:#fff;cursor:pointer;font-family:inherit}
  button:hover{background:linear-gradient(120deg,#2ec4b6,#1fa99b);color:#011627} button[disabled]{opacity:.6;cursor:wait}
  .msg{min-height:20px;margin-top:12px;font-size:13.5px}.msg.err{color:#b42318}
  .foot{margin-top:18px;display:flex;justify-content:space-between;font-size:12.5px;color:#8a99a4}
  .foot a{color:var(--mist)}
</style>

const norm = c => c.trim().toLowerCase().replace(/[\s-]+/g,'');
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(code){
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(norm(code)), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(P.salt), iterations:P.iter, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(P.iv)}, key, b64(P.ct));
  return new TextDecoder().decode(pt);
}
async function open_(code){
  const html = await decrypt(code);
  try{ sessionStorage.setItem('pp_key', norm(code)); }catch(e){}
  document.open(); document.write(html); document.close();
}
const msg = document.getElementById('msg'), btn = document.getElementById('go');
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault(); btn.disabled = true; msg.className='msg'; msg.textContent = 'Decrypting…';
  try{ await open_(document.getElementById('code').value); }
  catch(err){ msg.className='msg err'; msg.textContent = 'That code is not correct · Deze code klopt niet.'; btn.disabled = false; }
});
(async()=>{ let k=null; try{ k=sessionStorage.getItem('pp_key'); }catch(e){} if(k){ msg.textContent='Decrypting…'; try{ await open_(k); }catch(e){ msg.textContent=''; } } })();
})();
